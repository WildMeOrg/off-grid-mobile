name: Build and Release Android

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a field-test prerelease
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ELEBOOK_CONFIG_JSON: ${{ vars.ELEBOOK_CONFIG_JSON }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Configure release deployment
        run: npm run configure

      - name: Read and verify release version
        id: release-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! grep -Fq "versionName \"$VERSION\"" android/app/build.gradle; then
            echo "::error::package.json version $VERSION does not match android/app/build.gradle"
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::GitHub release v$VERSION already exists"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ELEBOOK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "::error::ELEBOOK_RELEASE_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/elebook-release.keystore

      - name: Run release quality gates
        run: |
          npm run typecheck
          npx eslint .
          npx jest --coverage --forceExit

      - name: Test, lint, and build signed ARM64 APK
        env:
          ORG_GRADLE_PROJECT_ELEBOOK_RELEASE_STORE_FILE: elebook-release.keystore
          ORG_GRADLE_PROJECT_ELEBOOK_RELEASE_STORE_PASSWORD: ${{ secrets.ELEBOOK_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ELEBOOK_RELEASE_KEY_ALIAS: ${{ secrets.ELEBOOK_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ELEBOOK_RELEASE_KEY_PASSWORD: ${{ secrets.ELEBOOK_RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Verify and name APK
        id: apk
        shell: bash
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          OUTPUT=android/app/build/outputs/apk/release/EleBook-v${VERSION}-arm64.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"

          echo "APK_PATH=$OUTPUT" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=$OUTPUT.sha256" >> "$GITHUB_ENV"
          echo "apk_path=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$OUTPUT.sha256" >> "$GITHUB_OUTPUT"

      - name: Generate field release notes
        shell: bash
        run: |
          {
            echo "## EleBook Android field test"
            echo
            echo "- Package: \`org.ganesha.elebook\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Architecture: \`arm64-v8a\`"
            echo "- Minimum Android: 7.0 (API 24)"
            echo
            echo "Install the APK before going offline, then sign in and download the model and project pack."
            echo
            echo "### SHA-256"
            echo
            echo '```text'
            cat "$CHECKSUM_PATH"
            echo '```'
          } > release-notes.md

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          EXTRA_ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi
          gh release create "v${VERSION}" \
            "$APK_PATH" \
            "$CHECKSUM_PATH" \
            --title "EleBook v${VERSION}" \
            --notes-file release-notes.md \
            "${EXTRA_ARGS[@]}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EleBook-v${{ steps.release-version.outputs.version }}-arm64
          path: |
            ${{ steps.apk.outputs.apk_path }}
            ${{ steps.apk.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30
